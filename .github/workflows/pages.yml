name: Docs site

# Publishes README, the worked example and the changelog to
# https://code.benweese.com/playwright-ai-qa-agents/, rendered by GitHub's Markdown API.
on:
  push:
    branches: [main]
    paths: ["README.md", "CHANGELOG.md", "docs/**", "scripts/build-site.mjs", "scripts/site.css", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/build-site.mjs _site
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
